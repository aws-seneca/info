name: Fix or update
description: Something in this repo is wrong, out of date, or missing
labels: ["content"]
body:
  - type: input
    id: where
    attributes:
      label: Which file?
      placeholder: guides/github-student-pack/README.md
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What should change?
    validations:
      required: true
