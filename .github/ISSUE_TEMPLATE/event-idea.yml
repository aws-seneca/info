name: Event idea
description: Propose an event, workshop, or topic for the club
title: "Event idea: "
labels: ["event", "idea"]
body:
  - type: markdown
    attributes:
      value: Anyone can propose an event. Rough ideas are welcome. The exec team will pick it up at the weekly meeting.
  - type: textarea
    id: what
    attributes:
      label: What is the event?
      description: The topic, and what people would learn or build.
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Format
      options:
        - Talk
        - Hands-on workshop
        - Panel
        - Quiz night
        - Hackathon
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - Foundation
        - Go deeper
        - Build
        - Ship
        - Not sure
  - type: textarea
    id: who
    attributes:
      label: Who would run it?
      description: You, someone you know, a speaker from industry, or nobody yet.
  - type: textarea
    id: needs
    attributes:
      label: What would it need?
      description: AWS credits, a room, laptops, a speaker, food.
